[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-task-monitor"
version = "0.1.0"
description = "Canvas LMS 与 Microsoft 365 邮箱学习任务监控：采集 → 变更检测 → 结构化抽取"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "jsonschema",
    "python-dotenv",
    "tenacity",
    "rich",
]

[project.optional-dependencies]
# MCP 形态入口（mcp_server.py）所需；本项目同时兼容 mcp 1.x / 2.x
mcp = ["mcp>=1.0.0"]
# dsh extra 指向的包名是占位——DSH 官方 SDK 的 PyPI 包名尚未确定。
# 等 DSH 插件文档到位后替换为真实包名，再启用此 extra。
# 当前 dsh_plugin.py 用 find_spec("dsh") 探测 SDK，不依赖此 extra 安装成功。
dsh = ["deepseek-harness-sdk>=0.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
all = ["canvas-task-monitor[mcp,dsh]"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ctm = "cli_main:main"
ctm-web = "web_main:main"
# ⚠️ src-layout + editable 安装（pip install -e .）下，这两个 console script 不可用：
#    根级 py-modules 不会被 editable finder 映射，`ctm` 会报 ModuleNotFoundError。
#    这是 setuptools 的已知边界，非本项目 bug。
#
#    开发期请用路径调用：python cli_main.py ... / python web_main.py ...
#    非 editable 安装（pip install .）时 scripts 正常生效。
#
#    未来若要 editable 下也能用，可选：
#      (A) 入口文件移入 src/canvas_task_monitor/（破坏"适配层在根"的架构约定）
#      (B) 放弃 src-layout（连累 Phase 1 的目录约定）
#    当前选择保持架构约束优先。

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
